<div class="tts-escape-stop-settings" id="tts_escape_stop_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="TTS Escape Stop">TTS Escape Stop</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="tts_escape_stop_enabled">
                <input id="tts_escape_stop_enabled" type="checkbox" />
                <span data-i18n="Stop TTS playback with the Escape key">Stop TTS playback with the Escape key</span>
            </label>
            <p class="tts-escape-stop-description">
                Pressing <b>Escape</b> stops in-progress TTS speech (any provider) and clears the TTS queue, so the next message will speak normally.
                Does nothing while TTS is idle, so it never interferes with Escape's usual job of canceling LLM generation.
            </p>
        </div>
    </div>
</div>
